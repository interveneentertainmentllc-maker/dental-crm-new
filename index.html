<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IL Dental CRM">
<meta name="theme-color" content="#0f3d36">
<title>IL Dental CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@10..48,400;10..48,600;10..48,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<style>
:root{
  --paper:#f4f1ea; --surface:#ffffff; --surface-2:#faf8f3;
  --ink:#16211d; --ink-soft:#4b5a53; --ink-faint:#8a978f;
  --line:#e2ddd1; --line-strong:#cfc8b8;
  --teal:#0f7a6b; --teal-deep:#0f3d36; --teal-wash:#e2efec;
  --amber:#bf6b16; --amber-wash:#fbeede;
  --green:#2f7d3f; --green-wash:#e6f1e4;
  --danger:#b3402f; --danger-wash:#f7e6e2;
  --shadow:0 1px 2px rgba(22,33,29,.06),0 8px 24px rgba(22,33,29,.08);
  --shadow-lg:0 12px 48px rgba(22,33,29,.22);
  --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --display:'Bricolage Grotesque',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;line-height:1.45;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;font-size:16px;}
::-webkit-scrollbar{width:0;height:0;}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;background:var(--paper);position:relative;}

header{padding:calc(var(--safe-top) + 14px) 16px 10px;background:var(--teal-deep);color:#fff;position:sticky;top:0;z-index:20;}
header .ht{display:flex;align-items:center;justify-content:space-between;gap:10px;}
header h1{font-family:var(--display);font-weight:700;font-size:20px;margin:0;letter-spacing:-.01em;}
header .sub{font-size:11px;color:#9fc7be;font-family:var(--mono);margin-top:2px;}
.synclink{display:inline-flex;align-items:center;gap:5px;margin-top:5px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#cfe7e1;font-size:10.5px;font-family:var(--mono);padding:3px 8px;border-radius:20px;cursor:pointer;}
.synclink:active{background:rgba(255,255,255,.16);}
.syncdot{width:7px;height:7px;border-radius:50%;background:#8a978f;display:inline-block;}
.syncdot.on{background:#37d39b;box-shadow:0 0 0 2px rgba(55,211,155,.3);}
.hbtns{display:flex;gap:6px;}
.hbtn{background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:8px 11px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;}
.hbtn:active{background:rgba(255,255,255,.25);}
.hbtn.sv{background:var(--amber);}
.searchbar{margin-top:10px;position:relative;}
.searchbar input{width:100%;background:rgba(255,255,255,.95);border:none;border-radius:12px;padding:11px 12px 11px 38px;font-size:15px;color:var(--ink);}
.searchbar svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5;}

.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;}
.tab{flex:1;padding:11px 6px;font-size:12px;font-weight:600;color:var(--ink-faint);text-align:center;border-bottom:2px solid transparent;}
.tab.on{color:var(--teal);border-bottom-color:var(--teal);}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--safe-bottom) + 90px);}

.cityrow{border-bottom:1px solid var(--line);background:var(--surface);}
.cityhdr{display:flex;align-items:center;gap:10px;padding:14px 16px;width:100%;text-align:left;}
.cityhdr:active{background:var(--surface-2);}
.cityname{font-family:var(--display);font-weight:600;font-size:16px;flex:1;}
.citycount{font-family:var(--mono);font-size:12px;color:var(--ink-faint);background:var(--surface-2);padding:2px 9px;border-radius:20px;}
.chev{transition:transform .2s;opacity:.5;}
.cityrow.open .chev{transform:rotate(90deg);}
.officelist{display:none;background:var(--surface-2);}
.cityrow.open .officelist{display:block;}

.office{padding:13px 16px 13px 22px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;}
.office:active{background:#f0ece2;}
.office .onm{flex:1;min-width:0;}
.office .otitle{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.office .oaddr{font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.badges{display:flex;gap:4px;flex-shrink:0;}
.dot{width:8px;height:8px;border-radius:50%;}
.dot.visited{background:var(--green);}
.dot.scanner{background:var(--teal);}
.dot.note{background:var(--amber);}
.pill{font-size:10px;font-family:var(--mono);padding:2px 6px;border-radius:6px;font-weight:500;}
.pill.sc{background:var(--teal-wash);color:var(--teal-deep);}

.empty{text-align:center;padding:60px 30px;color:var(--ink-faint);}
.empty h3{font-family:var(--display);color:var(--ink-soft);margin:0 0 6px;}

.fab{position:fixed;bottom:calc(var(--safe-bottom) + 18px);left:50%;transform:translateX(-50%);max-width:560px;width:calc(100% - 32px);display:flex;gap:10px;z-index:30;pointer-events:none;}
.fab>*{pointer-events:auto;}
.fab-add{flex:1;background:var(--teal);color:#fff;border-radius:14px;padding:15px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--shadow-lg);}
.fab-add:active{background:var(--teal-deep);}
.fab-exp{background:var(--teal-deep);color:#fff;border-radius:14px;padding:15px 17px;font-weight:600;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:7px;}

.sheet-bg{position:fixed;inset:0;background:rgba(15,33,30,.45);z-index:4000;opacity:0;pointer-events:none;transition:opacity .25s;}
.sheet-bg.show{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--paper);border-radius:20px 20px 0 0;z-index:4001;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:calc(100dvh - var(--safe-top) - 12px);display:flex;flex-direction:column;box-shadow:var(--shadow-lg);overflow:hidden;}
.sheet.show{transform:translateY(0);}
.sheet-grip{width:38px;height:5px;background:var(--line-strong);border-radius:3px;margin:10px auto 4px;flex:0 0 auto;}
.sheet-hd{display:flex;align-items:center;gap:10px;padding:8px 16px 14px;border-bottom:1px solid var(--line);flex:0 0 auto;}
.sheet-hd h2{font-family:var(--display);font-size:19px;margin:0;flex:1;font-weight:700;}
.sheet-x{font-size:22px;color:var(--ink-faint);padding:2px 6px;line-height:1;}
.sheet-body{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px;padding-bottom:calc(var(--safe-bottom) + 28px);}

.fld{margin-bottom:20px;}
.fld label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:8px;}
.fld input,.fld textarea,.fld select{width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:11px;padding:13px 12px;color:var(--ink);}
.fld textarea{min-height:80px;resize:vertical;line-height:1.5;}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--teal);}
.pinbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.visitbox{display:flex;flex-direction:column;gap:9px;}
.visitadd{display:flex;gap:8px;align-items:center;}
.visitadd input[type=date]{flex:1;font-family:var(--mono);font-size:13px;padding:9px 10px;border:1.5px solid var(--line-strong);border-radius:9px;background:var(--surface);color:var(--ink);}
.visitbtn{flex:0 0 auto;width:auto;background:var(--teal-wash);border:1.5px solid var(--teal);color:var(--teal-deep);padding:9px 12px;}
.visitlist{display:flex;flex-direction:column;gap:6px;}
.visititem{display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:14px;}
.visitdel{font-size:12px;color:var(--danger);background:none;border:none;cursor:pointer;padding:4px;}
.visitempty{font-size:13px;color:var(--ink-faint);font-style:italic;}
.pinbtn{display:inline-flex;align-items:center;gap:7px;width:auto;flex:0 0 auto;background:var(--teal-wash);border:1.5px solid var(--teal);color:var(--teal-deep);padding:11px 14px;}
.pinbtn:active{background:#cfe7e1;}
.pinbtn:disabled{opacity:.6;}
.pinstatus{font-family:var(--mono);font-size:12px;color:var(--ink-soft);flex:1 1 auto;min-width:120px;}
.row2{display:flex;gap:10px;}
.row2>*{flex:1;}

.scanopts{display:flex;flex-wrap:wrap;gap:7px;}
.scanopt{padding:9px 13px;border-radius:10px;background:var(--surface);border:1.5px solid var(--line-strong);font-size:13px;font-weight:600;color:var(--ink-soft);}
.scanopt.on{background:var(--teal);border-color:var(--teal);color:#fff;}

.detail-map{width:100%;height:170px;border:none;border-radius:14px;background:var(--surface-2);margin-bottom:14px;}
.maplinks{display:flex;gap:8px;margin-bottom:16px;}
.maplink{flex:1;text-align:center;background:var(--teal-wash);color:var(--teal-deep);padding:11px;border-radius:11px;font-weight:600;font-size:13px;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;}
.maplink:active{background:#cfe6e0;}

.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;}
.dcard .dl{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);font-weight:700;}
.dcard .dv{font-size:14px;font-weight:600;margin-top:3px;word-break:break-word;}
.dcard.full{grid-column:1/-1;}
.dcard a.dv{color:var(--teal);text-decoration:none;}
.notebox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:16px;white-space:pre-wrap;font-size:14px;line-height:1.55;color:var(--ink-soft);min-height:40px;}

.actions{display:flex;gap:9px;margin-top:4px;}
.btn{flex:1;border-radius:12px;padding:13px;font-weight:700;font-size:14px;text-align:center;display:flex;align-items:center;justify-content:center;gap:7px;}
.btn-primary{background:var(--teal);color:#fff;}
.btn-primary:active{background:var(--teal-deep);}
.btn-ghost{background:var(--surface);border:1.5px solid var(--line-strong);color:var(--ink-soft);}
.btn-danger{background:var(--danger-wash);color:var(--danger);}
.btn-danger:active{background:#f0d6cf;}

.toast{position:fixed;bottom:calc(var(--safe-bottom) + 96px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:30px;font-size:13px;font-weight:600;z-index:80;opacity:0;transition:all .3s;pointer-events:none;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-lg);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast .undo{color:var(--amber);font-weight:700;text-decoration:underline;pointer-events:auto;}

.statbar{display:flex;gap:0;background:var(--surface);border-bottom:1px solid var(--line);}
.stat{flex:1;text-align:center;padding:9px 4px;border-right:1px solid var(--line);}
.stat:last-child{border-right:none;}
.stat .sv{font-family:var(--display);font-weight:700;font-size:17px;}
.stat .sl{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);font-weight:600;}
.stat.v .sv{color:var(--green);}
.stat.s .sv{color:var(--teal);}

.exp-opt{display:flex;align-items:center;gap:13px;padding:15px;background:var(--surface);border:1px solid var(--line);border-radius:13px;margin-bottom:11px;width:100%;text-align:left;}
.exp-opt:active{background:var(--surface-2);}
.exp-ic{width:42px;height:42px;border-radius:11px;background:var(--teal-wash);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.exp-opt .et{font-weight:700;font-size:15px;}
.exp-opt .ed{font-size:12px;color:var(--ink-soft);margin-top:1px;}
.filterbar{display:flex;gap:7px;padding:10px 16px;background:var(--surface-2);border-bottom:1px solid var(--line);overflow-x:auto;}
.daterangebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--surface-2);border-bottom:1px solid var(--line);}
.daterangebar label{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-right:4px;}
.daterangebar input[type=date]{font-family:var(--mono);font-size:13px;padding:7px 9px;border:1.5px solid var(--line-strong);border-radius:9px;background:var(--surface);color:var(--ink);}
.daterangebar .drclear{font-size:12px;color:var(--teal);background:none;border:none;padding:6px;cursor:pointer;}
.fchip{font-size:12px;font-weight:600;padding:7px 13px;border-radius:20px;background:var(--surface);border:1px solid var(--line-strong);color:var(--ink-soft);white-space:nowrap;flex-shrink:0;}
.fchip.on{background:var(--teal-deep);color:#fff;border-color:var(--teal-deep);}
.loading{text-align:center;padding:70px 20px;color:var(--ink-faint);font-family:var(--mono);font-size:13px;}

/* ---------- Map view ---------- */
#mapview{display:none;flex:1;position:relative;z-index:1;}
#mapview.on{display:flex;}
body.sheet-open #mapview{z-index:0;}
body.sheet-open #mapview .leaflet-container{pointer-events:none;}
#map{flex:1;width:100%;height:100%;background:var(--surface-2);}
#mapcount{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:500;background:var(--teal-deep);color:#fff;font-size:12px;font-weight:600;font-family:var(--mono);padding:6px 14px;border-radius:20px;box-shadow:var(--shadow);pointer-events:none;}
.leaflet-container{font-family:var(--sans);}
.leaflet-popup-content-wrapper{border-radius:13px;box-shadow:var(--shadow-lg);}
.leaflet-popup-content{margin:12px 14px;}
.popup-nm{font-family:var(--display);font-weight:700;font-size:15px;color:var(--ink);margin-bottom:3px;line-height:1.25;}
.popup-ad{font-size:12px;color:var(--ink-soft);margin-bottom:8px;}
.popup-sc{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:600;background:var(--teal-wash);color:var(--teal-deep);padding:2px 7px;border-radius:6px;margin-bottom:8px;}
.popup-btn{display:block;width:100%;background:var(--teal);color:#fff;text-align:center;padding:9px;border-radius:9px;font-weight:700;font-size:13px;border:none;}
.popup-note{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12px;color:var(--ink-soft);margin-bottom:8px;max-height:80px;overflow-y:auto;white-space:pre-wrap;line-height:1.45;}
.popup-note .pnl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);margin-bottom:3px;}
.popup-quick{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:7px 9px;font-size:13px;margin-bottom:7px;resize:vertical;min-height:36px;}
.popup-row{display:flex;gap:6px;}
.popup-btn.ghost{background:var(--surface);border:1.5px solid var(--line-strong);color:var(--ink-soft);flex:1;}
.popup-btn.add{flex:1;}
.popup-meta{font-size:11px;color:var(--teal-deep);font-weight:600;margin-bottom:7px;font-family:var(--mono);}
.locate-btn{position:absolute;bottom:calc(var(--safe-bottom) + 90px);right:14px;z-index:600;width:52px;height:52px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-lg);}
.locate-btn:active{background:var(--teal-deep);}
.locate-btn.locating svg{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.userdot{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 4px rgba(26,115,232,.25),0 2px 6px rgba(0,0,0,.3);}
.nearby-toggle{position:absolute;bottom:calc(var(--safe-bottom) + 90px);left:14px;z-index:600;background:var(--teal-deep);color:#fff;border-radius:24px;padding:11px 16px;font-size:13px;font-weight:700;box-shadow:var(--shadow-lg);display:none;align-items:center;gap:7px;}
.nearby-toggle.show{display:flex;}
.pin{background:var(--teal);width:16px;height:16px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2.5px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.3);}
.pin.visited{background:var(--green);}
.pin.scanner{background:var(--amber);}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="ht">
    <div>
      <h1>IL Dental CRM</h1>
      <div class="sub" id="subline">loading…</div>
      <button id="btnSync" class="synclink" aria-label="Team sync settings">
        <span id="syncDot" class="syncdot"></span><span id="syncLabel">Team sync: off</span>
      </button>
    </div>
    <div class="hbtns">
      <button class="hbtn" id="btnView" aria-label="Toggle map view">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 3L3 6v15l6-3 6 3 6-3V3l-6 3-6-3z"/><path d="M9 3v15M15 6v15"/></svg>
        Map
      </button>
      <button class="hbtn" id="btnExport" aria-label="Export">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
        Export
      </button>
    </div>
  </div>
  <div class="searchbar">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
    <input id="search" type="search" placeholder="Search offices, cities, doctors…" autocomplete="off">
  </div>
</header>
<div class="statbar" id="statbar"></div>
<div class="filterbar" id="filterbar">
  <button class="fchip on" data-f="all">All</button>
  <button class="fchip" data-f="visited">Visited</button>
  <button class="fchip" data-f="unvisited">Not visited</button>
  <button class="fchip" data-f="scanner">Has scanner</button>
  <button class="fchip" data-f="notes">Has notes</button>
  <button class="fchip" data-f="custom">My added</button>
  <button class="fchip" data-f="d7">Visited ≤7d</button>
  <button class="fchip" data-f="d30">Visited ≤30d</button>
  <button class="fchip" data-f="drange">Date range</button>
</div>
<div class="daterangebar" id="daterangebar" style="display:none;"></div>
<main id="main"><div class="loading">Decompressing 5,300+ offices…</div></main>
<div id="mapview"><div id="map"></div><div id="mapcount"></div>
  <button class="locate-btn" id="locateBtn" aria-label="Find my location">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
  </button>
  <button class="nearby-toggle" id="nearbyBtn">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 1118 0z"/><circle cx="12" cy="10" r="3"/></svg>
    <span id="nearbyLabel">Nearest 25</span>
  </button>
</div>
</div>

<div class="fab">
  <button class="fab-add" id="btnAdd">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
    Add Office

   shared, everyone-sees-the-same-data mode. Blank = local-only.
   The whole team's store JSON lives in one cell of a Google Sheet, read

/* Row-per-office Sheet format. The Sheet holds ONE ROW per office the team
   has touched (visited / edited / added), so it's human-editable like a normal
   spreadsheet. Column order must match SHEET_COLS. The app converts between
   these rows and the internal `store` {over, add, del}. A row whose "visited"
   cell is the word DELETED (or whose name is blank) marks a removed seed office. */
const SHEET_COLS=["id","name","addr","city","zip","lat","lng","phone","email","scanner","lab","drs","hours","visitDay","visited","notes","visits"];

// Build the array-of-rows the Sheet should contain from the current store.
function storeToRows(){
  const rows=[];
  // edited seed offices
  Object.keys(store.over||{}).forEach(idx=>{
    const o=store.over[idx]||{}; const id="s"+idx;
    rows.push({id,name:o.name||"",addr:o.addr||"",city:o.city||"",zip:o.zip||"",lat:o.lat||"",lng:o.lng||"",
      phone:o.phone||"",email:o.email||"",scanner:o.scanner||"",lab:o.lab||"",drs:o.drs||"",hours:o.hours||"",
      visitDay:o.visitDay||"",visited:o.visited?"Yes":"",notes:o.notes||"",visits:(o.visits&&o.visits.length)?o.visits.join(" | "):""});
  });
  // deleted seed offices
  (store.del||[]).forEach(idx=>{ rows.push({id:"s"+idx,name:"",visited:"DELETED",addr:"",city:"",zip:"",lat:"",lng:"",phone:"",email:"",scanner:"",lab:"",drs:"",hours:"",visitDay:"",notes:"",visits:""}); });
  // newly added offices
  (store.add||[]).forEach(a=>{
    rows.push({id:a.id||("c"+Math.random().toString(36).slice(2)),name:a.name||"",addr:a.addr||"",city:a.city||"",zip:a.zip||"",
      lat:a.lat||"",lng:a.lng||"",phone:a.phone||"",email:a.email||"",scanner:a.scanner||"",lab:a.lab||"",drs:a.drs||"",
      hours:a.hours||"",visitDay:a.visitDay||"",visited:a.visited?"Yes":"",notes:a.notes||"",visits:(a.visits&&a.visits.length)?a.visits.join(" | "):""});
  });
  return rows;
}
// Rebuild the store object from rows read out of the Sheet.
function rowsToStore(rows){
  const ns={over:{},add:[],del:[]};
  const seenAddId={}, seenAddKey={};
  (rows||[]).forEach(r=>{
    const id=(r.id||"").trim(); if(!id) return;
    const visited=String(r.visited||"").trim().toLowerCase();
    if(id[0]==="s"){
      const idx=parseInt(id.slice(1),10); if(isNaN(idx)) return;
      // ONLY an explicit DELETED marker removes a base office. A blank row is
      // treated as "no override" and ignored — a partial/garbled Sheet read can
      // never delete the base list this way. (This was the data-wipe bug.)
      if(visited==="deleted"){ if(ns.del.indexOf(idx)<0)ns.del.push(idx); return; }
      if(!r.name&&!r.notes&&!r.scanner&&!r.lab&&!r.visitDay&&!r.phone&&!r.email&&!r.drs&&!r.hours&&!(r.visits&&String(r.visits).trim())) return;
      ns.over[idx]={name:r.name||"",addr:r.addr||"",city:r.city||"",zip:r.zip||"",lat:r.lat||"",lng:r.lng||"",
        phone:r.phone||"",email:r.email||"",scanner:r.scanner||"",lab:r.lab||"",drs:r.drs||"",hours:r.hours||"",
        visitDay:r.visitDay||"",visited:(visited==="yes"||visited==="true"||visited==="1"),notes:r.notes||"",visits:r.visits||""};
    } else {
      if(visited==="deleted") return; // a deleted custom office just disappears
      // De-duplicate added offices: skip if we've already taken this id,
      // or another row with the same name+address+city (case-insensitive).
      if(seenAddId[id]) return;
      const key=((r.name||"")+"|"+(r.addr||"")+"|"+(r.city||"")).toLowerCase().replace(/\s+/g," ").trim();
      if(key!=="||"&&seenAddKey[key]) return;
      seenAddId[id]=1; if(key!=="||")seenAddKey[key]=1;
      ns.add.push({id,name:r.name||"",addr:r.addr||"",city:r.city||"",zip:r.zip||"",lat:r.lat||"",lng:r.lng||"",
        phone:r.phone||"",email:r.email||"",scanner:r.scanner||"",lab:r.lab||"",drs:r.drs||"",hours:r.hours||"",
        visitDay:r.visitDay||"",visited:(visited==="yes"||visited==="true"||visited==="1"),notes:r.notes||"",visits:r.visits||"",seed:false});
    }
  });
  return ns;
}

// Read the Sheet (Apps Script returns {cols:[...], rows:[[...]]}) and adopt it.
async function cloudPull(){
  if(!cloudOn||pulling||pushing) return false;   // never read while a write is in flight
  pulling=true;
  let changed=false, emptySheet=false;
  try{
    const res=await fetch(GS_URL+(GS_URL.indexOf("?")<0?"?":"&")+"t="+Date.now(),{method:"GET"});
    if(!res.ok) throw new Error("http "+res.status);
    const text=await res.text();
    const doc=text&&text.trim()?JSON.parse(text):null;
    if(doc&&doc.cols&&Array.isArray(doc.rows)){
      const cols=doc.cols.map(c=>String(c).trim());
      const objs=doc.rows.map(arr=>{const o={};cols.forEach((c,i)=>o[c]=arr[i]==null?"":arr[i]);return o;});
      lastRawRows=objs.length;
      const ns=rowsToStore(objs);
      const js=JSON.stringify(ns);
      lastSyncAt=Date.now();
      // Compute the VISIBLE office count each store would produce: base SEED list
      // minus explicit deletions, plus custom adds. The base list is the source
      // of truth and must never shrink because of a bad/partial Sheet read.
      const seedN=SEED.length;
      // FAIL-SAFE: if the base list isn't loaded yet, we cannot validate anything —
      // never adopt a pull in that window (it could clear the list blind).
      if(seedN===0){
        emptySheet=false;
      } else {
      const curVisible = seedN - (store.del||[]).length + (store.add||[]).length;
      const newVisible = seedN - (ns.del||[]).length + (ns.add||[]).length;
      const localUnsynced = JSON.stringify(store)!==lastSyncJSON;
      // Refuse to adopt if it would DROP the visible count (data loss) unless this
      // device's own state is already in sync (meaning the change came from a
      // teammate's legitimate edit, not a partial read). Also hard-refuse any pull
      // that carries a mass deletion (>5% of base) — that is never a real edit.
      const massDelete = (ns.del||[]).length > Math.max(25, seedN*0.05);
      const wouldLose = newVisible < curVisible;
      const refuse = massDelete || (wouldLose && localUnsynced);
      if(refuse){
        emptySheet=false;
        setTimeout(()=>{ try{cloudPush(true);}catch(e){} },0);
      } else if(js!==lastSyncJSON){
        store=ns; lastSyncJSON=JSON.stringify(store);
        try{localStorage.setItem(SK,JSON.stringify(store));}catch(e){}
        changed=true;
      }
      }
    } else {
      emptySheet=true;   // no data rows yet
    }
  }catch(e){}
  finally{ pulling=false; }   // ALWAYS release the lock, even on error
  if(emptySheet){ await cloudPush(true); }   // seed from local, outside the lock
  return changed;
}
// Write to the Sheet by MERGING: read what's there, union it with our local
// diffs (ours wins on the same id), then write the union. A push can therefore
// never erase a teammate's edits — which was the real "wipe".
async function cloudPush(silent){
  if(!cloudOn||pushing) return;
  pushing=true;
  const prevSync=lastSyncJSON;
  try{
    // 1. Read the current Sheet so we don't clobber anyone.
    let remoteStore={over:{},add:[],del:[]};
    try{
      const res=await fetch(GS_URL+(GS_URL.indexOf("?")<0?"?":"&")+"t="+Date.now(),{method:"GET"});
      if(res.ok){
        const text=await res.text();
        const doc=text&&text.trim()?JSON.parse(text):null;
        if(doc&&doc.cols&&Array.isArray(doc.rows)){
          const cols=doc.cols.map(c=>String(c).trim());
          const objs=doc.rows.map(arr=>{const o={};cols.forEach((c,i)=>o[c]=arr[i]==null?"":arr[i]);return o;});
          remoteStore=rowsToStore(objs);
        }
      }
    }catch(e){ /* if read fails, fall back to writing our own (still safe: we never delete base offices) */ }

    // 2. MERGE remote + local. Local wins for the same key (most recent editor on
    //    this device), but every remote edit/add we don't touch is preserved.
    const merged={over:Object.assign({},remoteStore.over,store.over),
                  add:[],
                  del:Array.from(new Set([].concat(remoteStore.del||[],store.del||[])))};
    // merge adds by id, local taking precedence, then de-dupe by name+addr+city
    const addById={}; (remoteStore.add||[]).forEach(a=>{if(a.id)addById[a.id]=a;});
    (store.add||[]).forEach(a=>{if(a.id)addById[a.id]=a;});
    const seenKey={};
    Object.keys(addById).forEach(id=>{
      const a=addById[id];
      const key=((a.name||"")+"|"+(a.addr||"")+"|"+(a.city||"")).toLowerCase().replace(/\s+/g," ").trim();
      if(key!=="||"&&seenKey[key]) return; if(key!=="||")seenKey[key]=1;
      merged.add.push(a);
    });
    // a base office that's been re-edited shouldn't also remain "deleted"
    merged.del=merged.del.filter(idx=>!merged.over[idx]);

    // 3. Adopt the merge locally and write it as the new Sheet truth.
    store=merged;
    try{localStorage.setItem(SK,JSON.stringify(store));}catch(e){}
    const rows=storeToRows();
    const payload={cols:SHEET_COLS,rows:rows.map(r=>SHEET_COLS.map(c=>r[c]==null?"":r[c]))};
    lastSyncJSON=JSON.stringify(store);   // mark as ours so the next poll won't re-trigger
    const res=await fetch(GS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    if(!res.ok) throw new Error("http "+res.status);
    lastSyncAt=Date.now();
    rebuild();
    if(!silent) toast("Synced to team");
  }catch(e){ lastSyncJSON=prevSync; if(!silent) toast("⚠️ Sync failed — saved on device"); }
  finally{ pushing=false; }
}
// Poll for teammates' (or hand-) edits; adopt and re-render on change.
function cloudSubscribe(){
  if(!cloudOn) return;
  if(!pollTimer){
    pollTimer=setInterval(async ()=>{
      if(document.hidden||pushing||pulling) return;
      try{
        const changed=await cloudPull();
        if(changed){ rebuild(); render(); toast("Updated from the Sheet"); }
      }catch(e){}
      setSyncBadge();
    },POLL_MS);
  }
  // Watchdog: if the poll ever dies (network blip, suspended timer) or hasn't
  // synced in a while, clear stuck locks and bring it back — no user action.
  if(!watchdog){
    watchdog=setInterval(async ()=>{
      if(!cloudOn||document.hidden) return;
      const stale=lastSyncAt && (Date.now()-lastSyncAt > POLL_MS*3);
      if(!pollTimer || stale){
        pulling=false; pushing=false;
        if(!pollTimer) cloudSubscribe();
        try{ const changed=await cloudPull(); if(changed){ rebuild(); render(); } }catch(e){}
        setSyncBadge();
      }
    },POLL_MS*2);
  }
}
function cloudUnsubscribe(){
  if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
  if(watchdog){clearInterval(watchdog);watchdog=null;}
}
// If the Sheet contained more rows than the deduped store needs, the Sheet has
// duplicates — rewrite it once with the clean set so it self-heals.
async function cloudHeal(){
  // DISABLED. This used to compare Sheet row count vs local diff count and
  // force-overwrite the Sheet — but because the Sheet stores only diffs (not the
  // 5,292 base offices), that comparison was meaningless and would push a small
  // local store over everyone else's edits, presenting as a "wipe". Dedup of
  // rows is handled safely on read in rowsToStore(). Intentionally a no-op.
  return;
}

}

let SEED=[], DB=[], state={tab:"city",filter:"all",q:"",openCity:null,view:"list",dFrom:"",dTo:""};
let mapObj=null, clusterLayer=null, mapBuilt=false;
let userPos=null, userMarker=null, nearbyMode=false;
const NEARBY_N=25;

let undoStack=[];

/* ---------- persistence ---------- */
function load(){ try{const r=localStorage.getItem(SK); if(r)store=JSON.parse(r);}catch(e){} if(!store.over)store.over={}; if(!store.add)store.add=[]; if(!store.del)store.del=[]; }
function save(silent){ try{localStorage.setItem(SK,JSON.stringify(store));}catch(e){toast("⚠️ Save failed (storage full?)");return;} if(cloudOn){cloudPush(true).then(()=>{try{setSyncBadge();}catch(e){}});} if(!silent)toast(cloudOn?"Saved & syncing":"Saved");}
function pushUndo(label){ undoStack.push({snap:JSON.stringify(store),label}); if(undoStack.length>40)undoStack.shift(); }
function doUndo(){ if(!undoStack.length){toast("Nothing to undo");return;} const u=undoStack.pop(); store=JSON.parse(u.snap); save(true); rebuild(); render(); toast("Reverted: "+u.label); }

/* ---------- decompress seed ---------- */
// Pure-JS gzip/DEFLATE inflate (tiny-inflate by Joergen Ibsen / Devon Govett,
// public domain / MIT). Guarantees the office list loads even if the browser's
// DecompressionStream hangs or is unavailable. Returns a Uint8Array.
function tinyInflate(source){
  var TINF_OK=0,TINF_DATA_ERROR=-3;
  function Tree(){this.table=new Uint16Array(16);this.trans=new Uint16Array(288);}
  function Data(source,dest){this.s=source;this.i=0;this.t=0;this.bitcount=0;this.dest=dest;this.destLen=0;this.ltree=new Tree();this.dtree=new Tree();}
  var sltree=new Tree(),sdtree=new Tree();
  var length_bits=new Uint8Array(30),length_base=new Uint16Array(30);
  var dist_bits=new Uint8Array(30),dist_base=new Uint16Array(30);
  var clcidx=new Uint8Array([16,17,18,0,8,7,9,6,10,5,11,4,12,3,13,2,14,1,15]);
  var code_tree=new Tree(),lengths=new Uint8Array(288+32);
  function tinf_build_bits_base(bits,base,delta,first){var i,sum;for(i=0;i<delta;++i)bits[i]=0;for(i=0;i<30-delta;++i)bits[i+delta]=i/delta|0;for(sum=first,i=0;i<30;++i){base[i]=sum;sum+=1<<bits[i];}}
  function tinf_build_fixed_trees(lt,dt){var i;for(i=0;i<7;++i)lt.table[i]=0;lt.table[7]=24;lt.table[8]=152;lt.table[9]=112;for(i=0;i<24;++i)lt.trans[i]=256+i;for(i=0;i<144;++i)lt.trans[24+i]=i;for(i=0;i<8;++i)lt.trans[24+144+i]=280+i;for(i=0;i<112;++i)lt.trans[24+144+8+i]=144+i;for(i=0;i<5;++i)dt.table[i]=0;dt.table[5]=32;for(i=0;i<32;++i)dt.trans[i]=i;}
  var offs=new Uint16Array(16);
  function tinf_build_tree(t,lengths,off,num){var i,sum;for(i=0;i<16;++i)t.table[i]=0;for(i=0;i<num;++i)t.table[lengths[off+i]]++;t.table[0]=0;for(sum=0,i=0;i<16;++i){offs[i]=sum;sum+=t.table[i];}for(i=0;i<num;++i)if(lengths[off+i])t.trans[offs[lengths[off+i]]++]=i;}
  function tinf_getbit(d){if(!d.bitcount--){d.t=d.s[d.i++];d.bitcount=7;}var bit=d.t&1;d.t>>>=1;return bit;}
  function tinf_read_bits(d,num,base){if(!num)return base;while(d.bitcount<24){d.t|=d.s[d.i++]<<d.bitcount;d.bitcount+=8;}var val=d.t&(0xffff>>>(16-num));d.t>>>=num;d.bitcount-=num;return val+base;}
  function tinf_decode_symbol(d,t){while(d.bitcount<24){d.t|=d.s[d.i++]<<d.bitcount;d.bitcount+=8;}var sum=0,cur=0,len=0,tag=d.t;do{cur=2*cur+(tag&1);tag>>>=1;++len;sum+=t.table[len];cur-=t.table[len];}while(cur>=0);d.t=tag;d.bitcount-=len;return t.trans[sum+cur];}
  function tinf_decode_trees(d,lt,dt){var hlit,hdist,hclen,i,num,length;hlit=tinf_read_bits(d,5,257);hdist=tinf_read_bits(d,5,1);hclen=tinf_read_bits(d,4,4);for(i=0;i<19;++i)lengths[i]=0;for(i=0;i<hclen;++i){var clen=tinf_read_bits(d,3,0);lengths[clcidx[i]]=clen;}tinf_build_tree(code_tree,lengths,0,19);for(num=0;num<hlit+hdist;){var sym=tinf_decode_symbol(d,code_tree);switch(sym){case 16:var prev=lengths[num-1];for(length=tinf_read_bits(d,2,3);length;--length)lengths[num++]=prev;break;case 17:for(length=tinf_read_bits(d,3,3);length;--length)lengths[num++]=0;break;case 18:for(length=tinf_read_bits(d,7,11);length;--length)lengths[num++]=0;break;default:lengths[num++]=sym;break;}}tinf_build_tree(lt,lengths,0,hlit);tinf_build_tree(dt,lengths,hlit,hdist);}
  function tinf_inflate_block_data(d,lt,dt){for(;;){var sym=tinf_decode_symbol(d,lt);if(sym===256)return TINF_OK;if(sym<256){d.dest[d.destLen++]=sym;}else{var length,dist,offs2,i;sym-=257;length=tinf_read_bits(d,length_bits[sym],length_base[sym]);dist=tinf_decode_symbol(d,dt);offs2=d.destLen-tinf_read_bits(d,dist_bits[dist],dist_base[dist]);for(i=offs2;i<offs2+length;++i)d.dest[d.destLen++]=d.dest[i];}}}
  function tinf_inflate_uncompressed_block(d){var length,invlength,i;while(d.bitcount>8){d.i--;d.bitcount-=8;}length=d.s[d.i+1];length=256*length+d.s[d.i];invlength=d.s[d.i+3];invlength=256*invlength+d.s[d.i+2];if(length!==(~invlength&0x0000ffff))return TINF_DATA_ERROR;d.i+=4;for(i=length;i;--i)d.dest[d.destLen++]=d.s[d.i++];d.bitcount=0;return TINF_OK;}
  tinf_build_bits_base(length_bits,length_base,4,3);tinf_build_bits_base(dist_bits,dist_base,2,1);
  length_bits[28]=0;length_base[28]=258;
  tinf_build_fixed_trees(sltree,sdtree);
  // grow dest dynamically
  var dest=new Uint8Array(1<<20);
  function ensure(d,extra){if(d.destLen+extra>d.dest.length){var n=new Uint8Array(Math.max(d.dest.length*2,d.destLen+extra));n.set(d.dest);d.dest=n;}}
  var d=new Data(source,dest),bfinal,btype,res;
  do{
    ensure(d,1<<16);
    bfinal=tinf_getbit(d);btype=tinf_read_bits(d,2,0);
    if(btype===0)res=tinf_inflate_uncompressed_block(d);
    else if(btype===1)res=tinf_inflate_block_data(d,sltree,sdtree);
    else if(btype===2){tinf_decode_trees(d,d.ltree,d.dtree);res=tinf_inflate_block_data(d,d.ltree,d.dtree);}
    else return null;
    if(res!==TINF_OK)return null;
  }while(!bfinal);
  return d.dest.subarray(0,d.destLen);
}
function inflateGzipToString(bin){
  // strip 10-byte gzip header (+ optional extra fields) then inflate the DEFLATE body
  var i=10;
  var flg=bin[3];
  if(flg&4){var xlen=bin[i]|(bin[i+1]<<8);i+=2+xlen;}     // FEXTRA
  if(flg&8){while(bin[i]!==0)i++;i++;}                     // FNAME
  if(flg&16){while(bin[i]!==0)i++;i++;}                    // FCOMMENT
  if(flg&2)i+=2;                                           // FHCRC
  var out=tinyInflate(bin.subarray(i));
  if(!out) throw new Error("inflate failed");
  // bytes -> string (UTF-8)
  if(typeof TextDecoder!=="undefined") return new TextDecoder("utf-8").decode(out);
  var s="";for(var k=0;k<out.length;k++)s+=String.fromCharCode(out[k]);
  return decodeURIComponent(escape(s));
}
async function decompressSeed(){
  const bin=Uint8Array.from(atob(SEED_B64),c=>c.charCodeAt(0));
  // Use the reliable pure-JS inflate FIRST. The browser's native
  // DecompressionStream hangs on some iOS Safari builds, and our pure-JS
  // path decodes all 5,292 offices in ~0.1–0.3s, so there's no reason to
  // risk the native hang. Native is only a secondary fallback.
  try{
    return JSON.parse(inflateGzipToString(bin));
  }catch(e){
    if('DecompressionStream' in window){
      const ds=new DecompressionStream('gzip');
      const stream=new Response(new Blob([bin]).stream().pipeThrough(ds));
      const txt=await stream.text();
      return JSON.parse(txt);
    }
    throw e;
  }
}

/* ---------- build working DB ---------- */
// seed record: [n,a,c,z,lat,lng,co]  -> office object with id "s{idx}"
function rebuild(){
  DB=[];
  const delSet=new Set(store.del);
  const TXT=["name","addr","city","zip","county","phone","email","scanner","lab","drs","hours","visitDay","notes"];
  const norm=o=>{TXT.forEach(k=>{ if(o[k]==null)o[k]=""; else if(typeof o[k]!=="string")o[k]=String(o[k]); });
    // visits: a list of YYYY-MM-DD strings, newest first. May arrive as a
    // pipe/comma-separated string (from the Sheet) or already an array.
    if(o.visits==null)o.visits=[];
    else if(typeof o.visits==="string")o.visits=o.visits.split(/[|,]/).map(s=>s.trim()).filter(Boolean);
    else if(!Array.isArray(o.visits))o.visits=[];
    o.visits=o.visits.map(d=>normDate(d)).filter(Boolean).sort().reverse();
    return o;};
  SEED.forEach((r,i)=>{
    if(delSet.has(i))return;
    const o={id:"s"+i,seed:true,name:r[0],addr:r[1],city:r[2],zip:r[3],lat:r[4],lng:r[5],county:r[6],
             phone:"",email:"",scanner:"",lab:"",drs:"",hours:"",visitDay:"",notes:"",visited:false};
    const ov=store.over[i];
    if(ov)Object.assign(o,ov);
    DB.push(norm(o));
  });
  store.add.forEach(a=>DB.push(norm({...a,seed:false})));
}

/* ---------- helpers ---------- */
function officeById(id){return DB.find(o=>o.id===id);}
function isVisited(o){return !!(o.visited||o.visitDay||o.notes||(o.visits&&o.visits.length)||o.scanner&&o.scanner!=="None");}
// Date helpers. Internally a visit date is "YYYY-MM-DD".
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function normDate(s){ // accept YYYY-MM-DD, MM/DD/YYYY, or Date-ish; return YYYY-MM-DD or ""
  if(!s)return ""; s=String(s).trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m)return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m)return m[3]+"-"+m[1].padStart(2,"0")+"-"+m[2].padStart(2,"0");
  const d=new Date(s); if(!isNaN(d))return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  return "";
}
function fmtDate(s){ // YYYY-MM-DD -> "Jun 4, 2026"
  const d=normDate(s); if(!d)return "";
  const p=d.split("-"); const dt=new Date(+p[0],+p[1]-1,+p[2]);
  return dt.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
}
function daysAgo(s){const d=normDate(s);if(!d)return Infinity;const p=d.split("-");const dt=new Date(+p[0],+p[1]-1,+p[2]);return Math.floor((Date.now()-dt.getTime())/86400000);}
function lastVisit(o){return (o.visits&&o.visits.length)?o.visits[0]:"";}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function toast(msg,undo){const t=document.getElementById('toast');t.innerHTML=esc(msg)+(undo?' <span class="undo" id="undoLink">Undo</span>':'');t.classList.add('show');if(undo){document.getElementById('undoLink').onclick=()=>{doUndo();t.classList.remove('show');};}clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),undo?5000:1800);}

/* ---------- filtering ---------- */
function matchFilter(o){
  if(state.filter==="visited"&&!isVisited(o))return false;
  if(state.filter==="unvisited"&&isVisited(o))return false;
  if(state.filter==="scanner"&&!(o.scanner&&o.scanner!=="None"&&o.scanner!==""))return false;
  if(state.filter==="notes"&&!o.notes)return false;
  if(state.filter==="custom"&&o.seed)return false;
  if(state.filter==="d7"&&!(lastVisit(o)&&daysAgo(lastVisit(o))<=7))return false;
  if(state.filter==="d30"&&!(lastVisit(o)&&daysAgo(lastVisit(o))<=30))return false;
  if(state.filter==="drange"){
    const lv=lastVisit(o); if(!lv)return false;
    if(state.dFrom&&lv<state.dFrom)return false;
    if(state.dTo&&lv>state.dTo)return false;
  }
  if(state.q){const q=state.q.toLowerCase();const S=v=>(v==null?"":String(v)).toLowerCase();
    if(!(S(o.name).includes(q)||S(o.city).includes(q)||S(o.addr).includes(q)||S(o.drs).includes(q)||S(o.lab).includes(q)||S(o.zip).includes(q)))return false;}
  return true;
}

/* ---------- render ---------- */
function render(){
  try{ renderInner(); }
  catch(err){
    try{
      const m=document.getElementById('main');
      if(m) m.innerHTML='<div class="empty"><h3>List render error</h3><p style="font-family:monospace;font-size:12px;word-break:break-word;white-space:pre-wrap;text-align:left">'+
        (err&&err.message?err.message:String(err))+'\n\nfilter='+state.filter+' · DB='+(typeof DB!=="undefined"?DB.length:"?")+'</p></div>';
    }catch(_){}
    try{toast("render error: "+(err&&err.message?err.message:err));}catch(_){}
  }
}
function renderInner(){
  // keep the filter chips' highlight in sync with the real filter state
  // (a background sync re-render must never leave them disagreeing)
  document.querySelectorAll('.fchip').forEach(x=>x.classList.toggle('on',x.getAttribute('data-f')===state.filter));
  // date-range inputs appear only when the "Date range" filter is active
  const drb=document.getElementById('daterangebar');
  if(drb){
    if(state.filter==="drange"){
      drb.style.display="flex";
      if(drb.getAttribute('data-built')!=="1"){
        drb.innerHTML=`<label>From</label><input type="date" id="dr_from" value="${esc(state.dFrom)}">
          <label>To</label><input type="date" id="dr_to" value="${esc(state.dTo)}">
          <button class="drclear" id="dr_clear">Clear</button>`;
        drb.setAttribute('data-built','1');
        document.getElementById('dr_from').onchange=e=>{state.dFrom=e.target.value;render();};
        document.getElementById('dr_to').onchange=e=>{state.dTo=e.target.value;render();};
        document.getElementById('dr_clear').onclick=()=>{state.dFrom="";state.dTo="";document.getElementById('dr_from').value="";document.getElementById('dr_to').value="";render();};
      }
    } else { drb.style.display="none"; drb.setAttribute('data-built',"0"); drb.innerHTML=""; }
  }
  const filtered=DB.filter(matchFilter);
  // stats
  const tot=DB.length, vis=DB.filter(isVisited).length, sc=DB.filter(o=>o.scanner&&o.scanner!=="None"&&o.scanner!=="").length;
  document.getElementById('subline').textContent=tot.toLocaleString()+" offices · "+new Set(DB.map(o=>o.city)).size+" cities · v17";
  document.getElementById('statbar').innerHTML=
    `<div class="stat"><div class="sv">${tot.toLocaleString()}</div><div class="sl">Offices</div></div>
     <div class="stat v"><div class="sv">${vis}</div><div class="sl">Visited</div></div>
     <div class="stat s"><div class="sv">${sc}</div><div class="sl">Scanners</div></div>
     <div class="stat"><div class="sv">${store.add.length}</div><div class="sl">Added</div></div>`;

  const main=document.getElementById('main');
  if(state.view==="map"){ refreshMap(filtered); }
  if(!filtered.length){
    if(!SEED.length){ main.innerHTML=`<div class="empty"><h3>Loading offices…</h3><p>One moment while the list finishes loading.</p></div>`; }
    else { main.innerHTML=`<div class="empty"><h3>No offices found</h3><p>Try a different search or filter.</p></div>`; }
    return;
  }

  // group by city (null-safe: synced/added offices may have blank fields)
  const cities={};
  filtered.forEach(o=>{const c=(o.city||"Uncategorized");(cities[c]=cities[c]||[]).push(o);});
  const names=Object.keys(cities).sort((a,b)=>cities[b].length-cities[a].length||a.localeCompare(b));
  // auto-open when searching/filtering narrows things
  const forceOpen=(state.q||state.filter!=="all")&&filtered.length<120;

  let html="";
  names.forEach(city=>{
    const list=cities[city].sort((a,b)=>String(a.name||"").localeCompare(String(b.name||"")));
    const open=forceOpen||state.openCity===city;
    html+=`<div class="cityrow${open?' open':''}" data-city="${esc(city)}">
      <button class="cityhdr" data-cityhdr="${esc(city)}">
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>
        <span class="cityname">${esc(city)}</span>
        <span class="citycount">${list.length}</span>
      </button>
      <div class="officelist">`;
    list.forEach(o=>{
      const scOn=o.scanner&&o.scanner!=="None"&&o.scanner!=="";
      html+=`<button class="office" data-open="${o.id}">
        <div class="badges">
          <span class="dot ${isVisited(o)?'visited':''}" style="${isVisited(o)?'':'background:var(--line-strong)'}"></span>
        </div>
        <div class="onm"><div class="otitle">${esc(o.name)}</div><div class="oaddr">${esc(o.addr)}${o.zip?' · '+esc(o.zip):''}</div></div>
        ${scOn?`<span class="pill sc">${esc(o.scanner)}</span>`:''}
        ${o.notes?'<span class="dot note"></span>':''}
      </button>`;
    });
    html+=`</div></div>`;
  });
  main.innerHTML=html;
}

/* ---------- Map view ---------- */
function pinClass(o){ const scOn=o.scanner&&o.scanner!=="None"&&o.scanner!==""; return isVisited(o)?"visited":(scOn?"scanner":""); }
function haversine(lat1,lng1,lat2,lng2){
  const R=3958.8, toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function buildMap(){
  if(mapBuilt) return;
  mapObj=L.map('map',{zoomControl:true,tap:true}).setView([41.85,-87.85],10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19, attribution:'© OpenStreetMap'
  }).addTo(mapObj);
  clusterLayer=L.markerClusterGroup({chunkedLoading:true,maxClusterRadius:50,spiderfyOnMaxZoom:true});
  mapObj.addLayer(clusterLayer);
  mapObj.on('popupopen', wirePopup);
  mapBuilt=true;
}
function popupHTML(o){
  const scOn=o.scanner&&o.scanner!=="None"&&o.scanner!=="";
  let dist="";
  if(userPos&&o.lat&&o.lng){ dist=`<div class="popup-meta">${haversine(userPos.lat,userPos.lng,o.lat,o.lng).toFixed(1)} mi away</div>`; }
  const noteBlock = o.notes
    ? `<div class="popup-note"><div class="pnl">Notes</div>${esc(o.notes)}</div>`
    : '';
  return `<div class="popup-nm">${esc(o.name)}</div>
    <div class="popup-ad">${esc(o.addr)}, ${esc(o.city)}</div>
    ${dist}
    ${scOn?`<span class="popup-sc">${esc(o.scanner)}</span>`:''}
    ${noteBlock}
    <textarea class="popup-quick" id="pq_${o.id}" placeholder="Add a quick note…"></textarea>
    <button class="popup-btn add" data-pop-note="${o.id}" style="margin-bottom:6px;">Save note</button>
    <div class="popup-row">
      <button class="popup-btn ghost" data-pop-view="${o.id}">View</button>
      <button class="popup-btn ghost" data-pop-edit="${o.id}">Edit</button>
    </div>`;
}
function makeMarker(o){
  const icon=L.divIcon({className:'',html:`<div class="pin ${pinClass(o)}"></div>`,iconSize:[16,16],iconAnchor:[8,16],popupAnchor:[0,-15]});
  const m=L.marker([o.lat,o.lng],{icon});
  m.bindPopup(()=>popupHTML(o),{minWidth:230,maxWidth:260});
  m._oid=o.id;
  return m;
}
// Inline onclick inside a Leaflet popup is unreliable, so bind real listeners on popupopen.
function wirePopup(e){
  const el = (e.popup && e.popup.getElement) ? e.popup.getElement() : null;
  if(!el) return;
  const view = el.querySelector('[data-pop-view]');
  const edit = el.querySelector('[data-pop-edit]');
  const note = el.querySelector('[data-pop-note]');
  if(view) view.onclick = function(){ openDetail(view.getAttribute('data-pop-view')); };
  if(edit) edit.onclick = function(){ openForm(edit.getAttribute('data-pop-edit')); };
  if(note) note.onclick = function(){ quickNote(note.getAttribute('data-pop-note')); };
}
function refreshMap(filtered){
  buildMap();
  setTimeout(()=>mapObj.invalidateSize(),60);
  clusterLayer.clearLayers();
  let pts=filtered.filter(o=>o.lat&&o.lng);
  // nearby mode: restrict to N closest to the user
  if(nearbyMode && userPos){
    pts=pts.map(o=>({o,d:haversine(userPos.lat,userPos.lng,o.lat,o.lng)}))
           .sort((a,b)=>a.d-b.d).slice(0,NEARBY_N).map(x=>x.o);
  }
  document.getElementById('mapcount').textContent =
    (nearbyMode&&userPos ? `${pts.length} nearest` : `${pts.length.toLocaleString()} offices`);
  const markers=pts.map(makeMarker);
  clusterLayer.addLayers(markers);
  // fit bounds
  if(nearbyMode && userPos && pts.length){
    const b=L.latLngBounds(pts.map(o=>[o.lat,o.lng])); b.extend([userPos.lat,userPos.lng]);
    try{ mapObj.fitBounds(b.pad(0.12),{maxZoom:15}); }catch(e){}
  } else if(pts.length){
    try{ mapObj.fitBounds(L.latLngBounds(pts.map(o=>[o.lat,o.lng])).pad(0.05),{maxZoom:13}); }catch(e){}
  }
  drawUser();
}
function drawUser(){
  if(!userPos||!mapObj) return;
  if(userMarker){ userMarker.setLatLng([userPos.lat,userPos.lng]); }
  else{
    const ic=L.divIcon({className:'',html:'<div class="userdot"></div>',iconSize:[18,18],iconAnchor:[9,9]});
    userMarker=L.marker([userPos.lat,userPos.lng],{icon:ic,zIndexOffset:1000,interactive:false}).addTo(mapObj);
  }
}
function locateMe(){
  if(!navigator.geolocation){ toast("Location not supported on this device"); return; }
  // iOS Safari blocks geolocation on insecure origins (file:// or http://).
  // window.isSecureContext is true for https:// and localhost.
  if(window.isSecureContext===false){
    toast("Open the https:// site to use location");
    return;
  }
  const btn=document.getElementById('locateBtn');
  btn.classList.add('locating');
  if(state.view!=="map") setView("map");
  navigator.geolocation.getCurrentPosition(pos=>{
    btn.classList.remove('locating');
    userPos={lat:pos.coords.latitude,lng:pos.coords.longitude};
    nearbyMode=true;
    document.getElementById('nearbyBtn').classList.add('show');
    updateNearbyLabel();
    buildMap(); render(); // render triggers refreshMap (nearby)
    toast(`Showing ${NEARBY_N} offices near you`);
  }, err=>{
    btn.classList.remove('locating');
    let msg="Couldn't get your location";
    if(err.code===1) msg="Location blocked — allow it in Settings ▸ Safari";
    else if(err.code===2) msg="Location unavailable right now";
    else if(err.code===3) msg="Location timed out — try again";
    toast(msg);
  }, {enableHighAccuracy:true, timeout:20000, maximumAge:60000});
}
function updateNearbyLabel(){
  const lbl=document.getElementById('nearbyLabel');
  if(lbl) lbl.textContent = nearbyMode ? "Show all" : `Nearest ${NEARBY_N}`;
}
function toggleNearby(){
  if(!userPos){ locateMe(); return; }
  nearbyMode=!nearbyMode;
  updateNearbyLabel();
  render();
}
function setView(v){
  state.view=v;
  const mv=document.getElementById('mapview'), mn=document.getElementById('main');
  const btn=document.getElementById('btnView');
  if(v==="map"){
    mv.classList.add('on'); mn.style.display="none";
    btn.innerHTML=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 6h18M3 12h18M3 18h18"/></svg> List`;
    render();
  } else {
    mv.classList.remove('on'); mn.style.display="";
    btn.innerHTML=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 3L3 6v15l6-3 6 3 6-3V3l-6 3-6-3z"/><path d="M9 3v15M15 6v15"/></svg> Map`;
    render();
  }
}
function mapEmbed(o){
  if(o.lat&&o.lng) return `https://maps.google.com/maps?q=${o.lat},${o.lng}&z=16&output=embed`;
  return `https://maps.google.com/maps?q=${encodeURIComponent(o.name+' '+o.addr+' '+o.city+' IL '+o.zip)}&z=15&output=embed`;
}
function mapAppleLink(o){ return o.lat&&o.lng?`https://maps.apple.com/?q=${encodeURIComponent(o.name)}&ll=${o.lat},${o.lng}`:`https://maps.apple.com/?q=${encodeURIComponent(o.name+' '+o.addr+' '+o.city+' IL')}`; }
function mapGLink(o){ return o.lat&&o.lng?`https://www.google.com/maps/search/?api=1&query=${o.lat},${o.lng}`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.name+' '+o.addr+' '+o.city+' IL '+o.zip)}`; }

    <div class="fld"><label>Office Hours</label><input id="f_hours" value="${esc(o.hours)}" placeholder="Mon–Fri 8–5"></div>
    <div class="fld"><label>Visit Day / Time</label><input id="f_visit" value="${esc(o.visitDay)}" placeholder="Tue 10am"></div>
    <div class="fld"><label>Notes</label><textarea id="f_notes" placeholder="Add notes…">${esc(o.notes)}</textarea></div>
    <div class="fld"><label>Visit history</label>
      <div class="visitbox">
        <div class="visitadd">
          <input type="date" id="f_visitdate" value="${todayStr()}">
          <button type="button" class="btn btn-ghost visitbtn" id="f_visitadd">+ Log visit</button>
        </div>
        <div id="f_visitlist" class="visitlist"></div>
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-ghost" id="f_cancel">Cancel</button>
      <button class="btn btn-primary" id="f_save" data-id="${id||''}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M5 13l4 4L19 7"/></svg> Save</button>
    </div>`;
  let scan=o.scanner||"";
  document.getElementById('f_scanwrap').querySelectorAll('[data-scan]').forEach(b=>{
    b.onclick=()=>{const v=b.getAttribute('data-scan');scan=(scan===v)?"":v;document.querySelectorAll('#f_scanwrap .scanopt').forEach(x=>x.classList.toggle('on',x.getAttribute('data-scan')===scan));};
  });
  // Drop-pin: capture the rep's current GPS location into the lat/lng fields.
  document.getElementById('f_pin').onclick=function(){
    const btn=this, st=document.getElementById('f_pinstatus');
    if(!navigator.geolocation){ st.textContent="Location not supported on this device"; return; }
    if(window.isSecureContext===false){ st.textContent="Open the https:// site to use location"; return; }
    btn.disabled=true; st.textContent="Getting your location…";
    navigator.geolocation.getCurrentPosition(pos=>{
      const la=pos.coords.latitude, ln=pos.coords.longitude, acc=Math.round(pos.coords.accuracy||0);
      document.getElementById('f_lat').value=la.toFixed(6);
      document.getElementById('f_lng').value=ln.toFixed(6);
      st.innerHTML="📍 "+la.toFixed(5)+", "+ln.toFixed(5)+(acc?(' <span style="color:var(--ink-faint)">±'+acc+'m</span>'):'');
      btn.disabled=false; document.getElementById('f_pinlabel').textContent="Pin dropped — update";
      toast("Pinned your current location");
    }, err=>{
      btn.disabled=false;
      st.textContent = err.code===1 ? "Location blocked — allow it in Settings ▸ Safari"
        : err.code===3 ? "Location timed out — try again" : "Couldn't get your location";
    }, {enableHighAccuracy:true, timeout:20000, maximumAge:0});
  };
  document.getElementById('f_cancel').onclick=()=>{ if(id)openDetail(id); else hideSheet(); };
  // Visit history: editable working copy, newest first.
  let visits=Array.isArray(o.visits)?o.visits.slice():[];
  const renderVisits=()=>{
    const box=document.getElementById('f_visitlist');
    if(!visits.length){ box.innerHTML='<div class="visitempty">No visits logged yet.</div>'; return; }
    box.innerHTML=visits.map((d,i)=>`<div class="visititem"><span>${esc(fmtDate(d))}</span><button type="button" data-vi="${i}" class="visitdel">Remove</button></div>`).join('');
    box.querySelectorAll('[data-vi]').forEach(b=>{ b.onclick=()=>{ visits.splice(+b.getAttribute('data-vi'),1); renderVisits(); }; });
  };
  renderVisits();
  document.getElementById('f_visitadd').onclick=()=>{
    const v=normDate(document.getElementById('f_visitdate').value);
    if(!v){toast("Pick a date first");return;}
    if(visits.indexOf(v)<0){visits.push(v);visits.sort().reverse();}
    renderVisits();
  };
  document.getElementById('f_save').onclick=function(){ this.disabled=true; saveForm(id,()=>scan,()=>visits); };
  showSheet();
}

function saveForm(id,getScan,getVisits){
  const g=x=>document.getElementById(x).value.trim();
  const name=g('f_name'), city=g('f_city');
  if(!name){toast("Name is required");return;}
  if(!city){toast("City is required");return;}
  let visits=(getVisits?getVisits():[]).map(normDate).filter(Boolean);
  // Auto-fill: a brand-new office implies a visit today if the rep didn't log one.
  if(!id && !visits.length) visits=[todayStr()];
  visits=Array.from(new Set(visits)).sort().reverse();
  const data={name,addr:g('f_addr'),city,zip:g('f_zip'),
    lat:parseFloat(g('f_lat'))||"",lng:parseFloat(g('f_lng'))||"",
    phone:g('f_phone'),email:g('f_email'),scanner:getScan(),lab:g('f_lab'),
    drs:g('f_drs'),hours:g('f_hours'),visitDay:g('f_visit'),notes:g('f_notes'),visits};
  pushUndo(id?"edit "+name:"add "+name);
  if(!id){
    data.id="c"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
    data.visited=true;
    store.add.push(data);
  } else if(id[0]==="s"){
    const idx=parseInt(id.slice(1),10);
    store.over[idx]=Object.assign({},store.over[idx],data,{visited:true});
  } else {
    const a=store.add.find(x=>x.id===id); if(a)Object.assign(a,data);
  }
  save(true); rebuild(); render();
  toast("Saved",true);
  const newId=id||data.id;
  openDetail(newId);
}

function delOffice(id){
  const o=officeById(id); if(!o)return;
  if(!confirm("Delete \""+o.name+"\"? This can be undone.")) return;
  pushUndo("delete "+o.name);
  if(id[0]==="s"){ store.del.push(parseInt(id.slice(1),10)); delete store.over[parseInt(id.slice(1),10)]; }
  else { store.add=store.add.filter(x=>x.id!==id); }
  save(true); rebuild(); render(); hideSheet();
  toast("Deleted",true);
}

// Add/append a note straight from a map pin popup (visiting a practice in the field)
function quickNote(id){
  const o=officeById(id); if(!o) return;
  const ta=document.getElementById('pq_'+id);
  const txt=(ta?ta.value:'').trim();
  if(!txt){ toast("Type a note first"); return; }
  pushUndo("note "+o.name);
  const stamp=new Date().toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
  const line=`[${stamp}] ${txt}`;
  const newNotes = o.notes ? (o.notes.trimEnd()+"\n"+line) : line;
  if(id[0]==="s"){
    const idx=parseInt(id.slice(1),10);
    store.over[idx]=Object.assign({},store.over[idx],{notes:newNotes,visited:true});
  } else {
    const a=store.add.find(x=>x.id===id); if(a){ a.notes=newNotes; a.visited=true; }
  }
  save(true); rebuild(); render();
  // re-open this marker's popup with the freshly saved note
  if(clusterLayer){
    clusterLayer.eachLayer(m=>{ if(m._oid===id){ try{ clusterLayer.zoomToShowLayer(m,()=>m.openPopup()); }catch(e){ m.openPopup(); } } });
  }
  toast("Note saved",true);
}

/* ---------- export / email ---------- */
function buildCSV(onlyVisited){
  const rows=DB.filter(o=>onlyVisited?isVisited(o):true);
  const head=["Practice Name","Address","City","State","ZIP","Latitude","Longitude","County","Phone","Email","Scanner","Current Lab","Doctors","Office Hours","Visit Day/Time","Visited","Last Visited","Visit Count","All Visit Dates","Notes"];
  const q=v=>{v=(v==null?"":String(v));return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const lines=[head.join(",")];
  rows.forEach(o=>lines.push([o.name,o.addr,o.city,"IL",o.zip,o.lat,o.lng,o.county||"",o.phone,o.email,o.scanner,o.lab||"",o.drs,o.hours,o.visitDay,isVisited(o)?"Yes":"No",lastVisit(o)?fmtDate(lastVisit(o)):"",(o.visits&&o.visits.length)||0,(o.visits&&o.visits.length)?o.visits.map(fmtDate).join(" | "):"",o.notes].map(q).join(",")));
  return {csv:lines.join("\r\n"),count:rows.length};
}
function downloadCSV(onlyVisited){
  const {csv,count}=buildCSV(onlyVisited);
  const blob=new Blob([csv],{type:"text/csv"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=`IL-Dental-CRM-${onlyVisited?'visited':'all'}-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast(`Exported ${count} offices`);
}
function emailCSV(){
  const {csv,count}=buildCSV(true);
  // try Web Share with file (iOS Safari supports navigator.share files)
  const file=new File([csv],`IL-Dental-visited-${new Date().toISOString().slice(0,10)}.csv`,{type:"text/csv"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:"IL Dental CRM — Visited Offices",text:`${count} visited offices for marketing.`}).catch(()=>{});
  } else {
    // fallback: mailto with summary (CSV body truncated by mail clients, so also trigger download)
    downloadCSV(true);
    const body=encodeURIComponent(`${count} visited dental offices attached (downloaded as CSV — please attach the file).\n\nGenerated by IL Dental CRM.`);
    location.href=`mailto:?subject=${encodeURIComponent('IL Dental CRM — Visited Offices ('+count+')')}&body=${body}`;
  }
}
function openExport(){
  document.getElementById('sheetTitle').textContent="Export / Share";
  document.getElementById('sheetBody').innerHTML=`
    <button class="exp-opt" id="ex_share">
      <span class="exp-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--teal-deep)" stroke-width="2.2"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8M16 6l-4-4-4 4M12 2v14"/></svg></span>

      <span><span class="et">Download visited only</span><span class="ed">CSV of offices you've visited / noted</span></span></button>

function setSyncBadge(){
  const dot=document.getElementById('syncDot'), lbl=document.getElementById('syncLabel');
  if(!dot||!lbl) return;
  if(cloudOn){
    dot.classList.add('on');
    let ago="";
    if(lastSyncAt){
      const s=Math.round((Date.now()-lastSyncAt)/1000);
      ago = s<5?" · just now" : s<60?(" · "+s+"s ago") : (" · "+Math.round(s/60)+"m ago");
      lbl.textContent="Team sync: on"+ago;
    } else {
      lbl.textContent="Team sync: connecting…";
    }
  }
  else { dot.classList.remove('on'); lbl.textContent="Team sync: off"; }
}
function openSync(){
  document.getElementById('sheetTitle').textContent="Team Sync";
  const on=cloudOn;
  // Apps Script source shown to the user — kept out of the template literal
  // below (assembled by lines) so its braces/quotes don't fight the HTML.
  const gsScript=[
    '// IL Dental CRM — row-per-office sync. One row per office; edit cells freely.',
    'var COLS=["id","name","addr","city","zip","lat","lng","phone","email","scanner","lab","drs","hours","visitDay","visited","notes","visits"];',
    'function sheet_(){ return SpreadsheetApp.getActiveSpreadsheet().getSheets()[0]; }',
    'function ensureHeader_(sh){',
    '  var first=sh.getRange(1,1,1,COLS.length).getValues()[0];',
    '  if(first[0]!=="id"){ sh.getRange(1,1,1,COLS.length).setValues([COLS]); sh.setFrozenRows(1); }',
    '}',
    'function doGet(){',
    '  var sh=sheet_(); ensureHeader_(sh);',
    '  var last=sh.getLastRow(); var rows=[];',
    '  if(last>1){ rows=sh.getRange(2,1,last-1,COLS.length).getValues()',
    '    .filter(function(r){return String(r[0]).trim()!=="";}); }',
    '  var out=JSON.stringify({cols:COLS,rows:rows});',
    '  return ContentService.createTextOutput(out).setMimeType(ContentService.MimeType.JSON);',
    '}',
    'function doPost(e){',
    '  var body=(e&&e.postData&&e.postData.contents)||"{}";',
    '  var doc=JSON.parse(body); var rows=doc.rows||[];',
    '  var sh=sheet_(); ensureHeader_(sh);',
    '  var last=sh.getLastRow();',
    '  if(last>1){ sh.getRange(2,1,last-1,COLS.length).clearContent(); }',
    '  if(rows.length){ sh.getRange(2,1,rows.length,COLS.length).setValues(rows); }',
    '  return ContentService.createTextOutput("ok").setMimeType(ContentService.MimeType.TEXT);',
    '}'
  ].join("\n");
  document.getElementById('sheetBody').innerHTML=`
    <div style="font-size:13px;color:var(--ink-soft);line-height:1.55;margin-bottom:14px;">
      Turn on shared mode so everyone with the link sees the same offices, notes and visits. Each touched office is one editable row in your Google Sheet — you can change cells right in the Sheet and the app picks it up within about 15 seconds. Leave blank to keep data only on this device.
    </div>
    <div style="font-size:12px;color:var(--ink);font-weight:700;margin-bottom:4px;">Status</div>
    <div style="font-size:13px;margin-bottom:14px;color:${on?'var(--green)':'var(--ink-faint)'};font-family:var(--mono);">
      ${on?'● Connected — sharing with your team':'○ Off — local only on this device'}
    </div>
    <div class="fld"><label>Apps Script Web App URL</label>
      <input id="sy_url" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(GS_URL)}"></div>
    <div class="actions" style="margin-top:2px;">
      <button class="btn btn-ghost" id="sy_off">Turn off</button>
      <button class="btn btn-primary" id="sy_save">Save &amp; connect</button>
    </div>
    ${on?`<button class="btn btn-ghost" id="sy_now" style="width:100%;margin-top:9px;">↻ Sync now</button>`:``}
    <button class="btn btn-ghost" id="sy_restore" style="width:100%;margin-top:9px;">⟳ Restore full office list</button>
    <div style="font-size:11px;color:var(--ink-soft);margin-top:5px;line-height:1.5;">Brings back all ${SEED.length.toLocaleString()} base offices if the list ever looks empty. Your added offices and notes are kept.</div>
    <details style="margin-top:16px;">
      <summary style="font-size:12.5px;color:var(--teal-deep);font-weight:700;cursor:pointer;">One-time setup (≈5 min)</summary>
      <ol style="font-size:12px;color:var(--ink-soft);line-height:1.6;padding-left:18px;margin-top:8px;">
        <li>Create a new Google Sheet (sheets.new). This is where the data lives.</li>
        <li>In the Sheet, open <b>Extensions ▸ Apps Script</b>.</li>
        <li>Delete any sample code, paste the script below, and click <b>Save</b>.</li>
        <li>Click <b>Deploy ▸ New deployment</b>. Set type to <b>Web app</b>. Under "Who has access" choose <b>Anyone</b>. Click <b>Deploy</b> and authorize when prompted.</li>
        <li>Copy the <b>Web app URL</b> it gives you (ends in <code>/exec</code>), paste it in the field above, then <b>Save &amp; connect</b>.</li>
        <li>Share your GitHub Pages link with the team — everyone reads &amp; writes the same Sheet.</li>
      </ol>
      <div style="font-size:11.5px;color:var(--ink-soft);margin-top:6px;line-height:1.5;">Editing in the Sheet: each office is one row. Change any cell (notes, scanner, lab, lat/lng…) and the app updates on its next check. To remove an office, type <b>DELETED</b> in its <b>visited</b> column. Don't change the <b>id</b> column or the header row.</div>
      <div style="font-size:11px;color:var(--ink);font-weight:700;margin:8px 0 4px;">Apps Script to paste</div>
      <textarea readonly id="sy_code" style="width:100%;min-height:150px;font-family:var(--mono);font-size:10.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px;line-height:1.45;white-space:pre;color:var(--ink);">${esc(gsScript)}</textarea>
      <button class="btn btn-ghost" id="sy_copy" style="margin-top:8px;">Copy script</button>
      <div style="font-size:11.5px;color:var(--amber);margin-top:8px;">Note: "Anyone" access means anyone with the link can read &amp; edit (what you asked for). The marketing team can also open the Sheet directly. For a private team, add a password layer later.</div>
    </details>`;
  document.getElementById('sy_copy').onclick=()=>{
    const ta=document.getElementById('sy_code'); ta.select();
    try{document.execCommand('copy');toast("Script copied");}catch(e){
      try{navigator.clipboard.writeText(gsScript);toast("Script copied");}catch(_){toast("Select and copy manually");}
    }
  };
  document.getElementById('sy_save').onclick=async()=>{
    const u=document.getElementById('sy_url').value.trim();
    if(!u){toast("Paste your Web App URL");return;}
    if(!/^https:\/\/script\.google\.com\/.*\/exec/.test(u)){toast("That doesn't look like an /exec URL");return;}
    pulling=false; pushing=false;            // clear any stuck locks
    cloudSaveConfig(u); cloudInit(); cloudUnsubscribe();
    toast("Connecting…");
    const pulled=await cloudPull(); await cloudHeal(); cloudSubscribe();
    rebuild(); render(); setSyncBadge(); hideSheet();
    toast(pulled?"Connected — pulled team data":"Connected — sharing this device's data");
  };
  const restoreBtn=document.getElementById('sy_restore');
  if(restoreBtn) restoreBtn.onclick=async()=>{
    if(!confirm("Restore all "+SEED.length.toLocaleString()+" base offices? Your added offices and notes are kept; this just un-hides any that went missing.")) return;
    store.del=[];                       // un-hide every base office
    save(true); rebuild(); render();
    if(cloudOn){ try{ pulling=false; pushing=false; await cloudPush(true); }catch(e){} setSyncBadge(); }
    hideSheet();
    toast("Restored "+DB.length.toLocaleString()+" offices");
  };
  if(nowBtn) nowBtn.onclick=async()=>{
    pulling=false; pushing=false;            // clear any stuck locks
    cloudInit(); cloudUnsubscribe();
    toast("Syncing…");
    const changed=await cloudPull(); await cloudHeal(); cloudSubscribe();
    rebuild(); render(); setSyncBadge();
    toast("Synced");
  };
  document.getElementById('sy_off').onclick=()=>{
    cloudSaveConfig(""); cloudOn=false; cloudUnsubscribe();
    pulling=false; pushing=false;
    setSyncBadge(); hideSheet(); toast("Team sync turned off");
  };
  showSheet();
}
function showSheet(){document.body.classList.add('sheet-open');document.getElementById('sheetBg').classList.add('show');document.getElementById('sheet').classList.add('show');}
function hideSheet(){document.body.classList.remove('sheet-open');document.getElementById('sheetBg').classList.remove('show');document.getElementById('sheet').classList.remove('show');}

/* ---------- events ---------- */
function wire(){
  document.getElementById('main').addEventListener('click',e=>{
    const ch=e.target.closest('[data-cityhdr]');
    if(ch){const c=ch.getAttribute('data-cityhdr');state.openCity=(state.openCity===c)?null:c;
      const row=ch.closest('.cityrow');
      // if forceOpen mode, just toggle this row
      if(row.classList.contains('open')&&state.openCity!==c){row.classList.remove('open');}
      else if(state.openCity===c){document.querySelectorAll('.cityrow.open').forEach(r=>{if(r!==row)r.classList.remove('open');});row.classList.add('open');}
      else{row.classList.toggle('open');}
      return;}
    const op=e.target.closest('[data-open]');
    if(op){openDetail(op.getAttribute('data-open'));return;}
  });
  document.getElementById('sheetBody').addEventListener('click',e=>{
    const ed=e.target.closest('[data-edit]'); if(ed){openForm(ed.getAttribute('data-edit'));return;}
    const dl=e.target.closest('[data-del]'); if(dl){delOffice(dl.getAttribute('data-del'));return;}
  });
  document.getElementById('btnAdd').onclick=()=>openForm(null);
  document.getElementById('btnExport').onclick=openExport;
  document.getElementById('btnSync').onclick=openSync;
  document.getElementById('btnView').onclick=()=>setView(state.view==="map"?"list":"map");
  document.getElementById('locateBtn').onclick=locateMe;
  document.getElementById('nearbyBtn').onclick=toggleNearby;
  document.getElementById('btnEmail').onclick=()=>{hideSheet();setTimeout(emailCSV,200);};
  document.getElementById('sheetX').onclick=hideSheet;
  document.getElementById('sheetBg').onclick=hideSheet;
  let st;
  document.getElementById('search').addEventListener('input',e=>{clearTimeout(st);st=setTimeout(()=>{state.q=e.target.value.trim();render();},180);});
  document.getElementById('filterbar').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;state.filter=b.getAttribute('data-f');document.querySelectorAll('.fchip').forEach(x=>x.classList.toggle('on',x===b));render();requestAnimationFrame(render);});
  // autosave safety on hide/blur
  window.addEventListener('beforeunload',()=>save(true));
  window.addEventListener('pagehide',()=>save(true));
  // iOS suspends background timers; when the app comes back to the foreground,
  // clear any stuck locks, pull the latest, and make sure the poll is running.
  document.addEventListener('visibilitychange',async ()=>{
    if(document.hidden||!cloudOn) return;
    pulling=false; pushing=false;
    const changed=await cloudPull();
    if(changed){ rebuild(); render(); }
    if(!pollTimer) cloudSubscribe();
  });
  window.addEventListener('focus',()=>{ if(cloudOn&&!pollTimer) cloudSubscribe(); });
}

/* ---------- boot ---------- */
// Expose popup-invoked handlers globally as a safety net.
window.openDetail=openDetail; window.quickNote=quickNote; window.openForm=openForm;
(async function init(){
  load();
  cloudInit();
  setSyncBadge();                 // reflect saved sync state immediately

  // STEP 1: Always build the base list FIRST. The 5,292 offices live in the file,
  // not the cloud, so they must exist before any sync runs — otherwise a pull
  // could operate against an empty base and the anti-wipe guard would be blind.
  try{ SEED=await decompressSeed(); }
  catch(e){ document.getElementById('main').innerHTML='<div class="empty"><h3>Load error</h3><p>'+esc(e.message)+'</p></div>'; return; }
  rebuild(); wire(); render();
  setSyncBadge();

  // STEP 2: Now that the base list is up, start cloud sync. It can only ADD or
  // OVERLAY — never wipe the base list (guarded in cloudPull).
  if(cloudOn){
    (async()=>{ try{ await cloudPull(); await cloudHeal(); }catch(e){} cloudSubscribe(); rebuild(); render(); setSyncBadge(); })();
  }
})();
</script>
